name: CI/CD Pipeline_APP_PRODUTOS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Verify env vars
        run: |
          echo "DB_HOST=${{ secrets.DB_HOST }}"
          echo "DB_NAME=${{ secrets.DB_DATABASE }}"
          echo "APP_ENV=${{ secrets.APP_ENV }}"

      - name: Log in to GitHub Container Registry
        run: echo ${{ secrets.CR_PAT }} | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

      - name: Set lowercase repository owner
        id: repo_owner
        run: echo "REPO_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # Build Backend
      - name: Build Backend Docker image
        run: |
          docker build -f Dockerfile.backend \
            -t ghcr.io/${{ env.REPO_OWNER }}/app_produtos_backend:${{ github.sha }} .

      - name: Push Backend Docker image
        run: |
          docker tag ghcr.io/${{ env.REPO_OWNER }}/app_produtos_backend:${{ github.sha }} ghcr.io/${{ env.REPO_OWNER }}/app_produtos_backend:latest
          docker push ghcr.io/${{ env.REPO_OWNER }}/app_produtos_backend:${{ github.sha }}
          docker push ghcr.io/${{ env.REPO_OWNER }}/app_produtos_backend:latest

      # Build Frontend
      - name: Build Frontend Docker image
        run: |
          docker build -f Dockerfile.frontend \
            -t ghcr.io/${{ env.REPO_OWNER }}/app_produtos_frontend:${{ github.sha }} .

      - name: Push Frontend Docker image
        run: |
          docker tag ghcr.io/${{ env.REPO_OWNER }}/app_produtos_frontend:${{ github.sha }} ghcr.io/${{ env.REPO_OWNER }}/app_produtos_frontend:latest
          docker push ghcr.io/${{ env.REPO_OWNER }}/app_produtos_frontend:${{ github.sha }}
          docker push ghcr.io/${{ env.REPO_OWNER }}/app_produtos_frontend:latest

      # Deploy
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY_2 }}

      - name: Deploy to Server
        run: |
          ssh -t -o StrictHostKeyChecking=no -o ConnectTimeout=60 -p ${{ secrets.SERVER_PORT_SSH_2 }} ${{ secrets.SERVER_USER_SSH_2 }}@${{ secrets.SERVER_HOST_SSH_2 }} << EOF
            # Parar e remover containers antigos se existirem
            for c in app_mysql app_backend app_frontend; do
              container_id=\$(sudo docker ps -aq --filter "name=^/\$c\$") 
              if [ -n "\$container_id" ]; then
                echo "Parando container \$c..."
                sudo docker stop \$container_id
                sudo docker rm \$container_id
              fi
            done

            # Pull das imagens novas
            sudo docker pull ghcr.io/${{ env.REPO_OWNER }}/app_produtos_backend:latest
            sudo docker pull ghcr.io/${{ env.REPO_OWNER }}/app_produtos_frontend:latest

            # Subir MySQL
            sudo docker run -d --name app_mysql --restart=always --network bridge \
              -e MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }} \
              -e MYSQL_DATABASE=${{ secrets.DB_DATABASE }} \
              -e MYSQL_USER=${{ secrets.DB_USERNAME }} \
              -e MYSQL_PASSWORD=${{ secrets.DB_PASSWORD }} \
              -p 3310:3306 mysql:8.0

            # Subir Backend
            sudo docker run -d --name app_backend --restart=always --network bridge \
              -e TZ=America/Sao_Paulo \
              -e APP_ENV=${{ secrets.APP_ENV }} \
              -e APP_KEY=${{ secrets.APP_KEY }} \
              -e APP_DEBUG=${{ secrets.APP_DEBUG }} \
              -e APP_URL=${{ secrets.APP_URL }} \
              -e DB_CONNECTION=mysql \
              -e DB_HOST=app_mysql \
              -e DB_PORT=3306 \
              -e DB_DATABASE=${{ secrets.DB_DATABASE }} \
              -e DB_USERNAME=${{ secrets.DB_USERNAME }} \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              -p 8000:8000 ghcr.io/${{ env.REPO_OWNER }}/app_produtos_backend:latest

            # Esperar backend subir
            sleep 10

            # Subir Frontend
            sudo docker run -d --name app_frontend --restart=always --network bridge \
              -e TZ=America/Sao_Paulo \
              -e VITE_API_URL=http://app_backend:8000/api \
              -p 3009:80 ghcr.io/${{ env.REPO_OWNER }}/app_produtos_frontend:latest
          EOF
