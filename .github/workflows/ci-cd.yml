name: CI/CD Pipeline_APP_PRODUTOS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set lowercase repo owner
        id: repo_owner
        run: echo "REPO_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        run: echo ${{ secrets.CR_PAT }} | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

      # Backend
      - name: Build Backend
        run: |
          docker build -f Dockerfile.backend -t ghcr.io/${{ env.REPO_OWNER }}/app_produtos_back:${{ github.sha }} .
          docker tag ghcr.io/${{ env.REPO_OWNER }}/app_produtos_back:${{ github.sha }} ghcr.io/${{ env.REPO_OWNER }}/app_produtos_back:latest
          docker push ghcr.io/${{ env.REPO_OWNER }}/app_produtos_back:${{ github.sha }}
          docker push ghcr.io/${{ env.REPO_OWNER }}/app_produtos_back:latest

      # Frontend
      - name: Build Frontend
        run: |
          docker build -f Dockerfile.frontend -t ghcr.io/${{ env.REPO_OWNER }}/app_frontend_front:${{ github.sha }} .
          docker tag ghcr.io/${{ env.REPO_OWNER }}/app_frontend_front:${{ github.sha }} ghcr.io/${{ env.REPO_OWNER }}/app_frontend_front:latest
          docker push ghcr.io/${{ env.REPO_OWNER }}/app_frontend_front:${{ github.sha }}
          docker push ghcr.io/${{ env.REPO_OWNER }}/app_frontend_front:latest

      # Deploy via SSH
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST_2 }}
          username: ${{ secrets.SERVER_USER_2 }}
          key: ${{ secrets.SERVER_SSH_KEY_2 }}
          port: ${{ secrets.SERVER_PORT_SSH_2 }}
          script: |
            echo "===== Removendo containers antigos ====="
            for c in app_backend app_frontend; do
              if sudo docker ps -a --format '{{.Names}}' | grep -Eq "^$c$"; then
                echo "Removendo container $c..."
                sudo docker rm -f $c
              fi
            done

            echo "===== Garantindo rede Docker ====="
            if ! sudo docker network ls | grep -q app_network; then
              sudo docker network create --driver bridge app_network
            fi

            echo "===== Pull das imagens ====="
            sudo docker pull ghcr.io/${{ env.REPO_OWNER }}/app_produtos_back:latest
            sudo docker pull ghcr.io/${{ env.REPO_OWNER }}/app_frontend_front:latest

            echo "===== Subindo Backend ====="
            sudo docker run -d --name app_backend --restart=always --network app_network \
              -e TZ=America/Sao_Paulo \
              -e APP_ENV=${{ secrets.APP_ENV }} \
              -e APP_KEY=${{ secrets.APP_KEY }} \
              -e APP_DEBUG=${{ secrets.APP_DEBUG }} \
              -e APP_URL=${{ secrets.APP_URL }} \
              -e DB_CONNECTION=mysql \
              -e DB_HOST=${{ secrets.DB_HOST }} \
              -e DB_PORT=${{ secrets.DB_PORT }} \
              -e DB_DATABASE=${{ secrets.DB_DATABASE }} \
              -e DB_USERNAME=${{ secrets.DB_USERNAME }} \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              -p 8000:8000 ghcr.io/${{ env.REPO_OWNER }}/app_produtos_back:latest

            echo "Aguardando backend subir..."
            sleep 10

            echo "===== Subindo Frontend ====="
            sudo docker run -d --name app_frontend --restart=always --network app_network \
              -e TZ=America/Sao_Paulo \
              -e VITE_API_URL=${{ secrets.VITE_API_URL }} \
              -p 3009:80 ghcr.io/${{ env.REPO_OWNER }}/app_frontend_front:latest
