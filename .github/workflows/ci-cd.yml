name: CI/CD Pipeline APP_PRODUTOS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set lowercase repo owner
        id: repo_owner
        run: echo "REPO_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        run: echo ${{ secrets.CR_PAT }} | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

      # Backend
      - name: Build Backend
        run: |
          docker build -f Dockerfile.backend -t ghcr.io/${{ env.REPO_OWNER }}/app_backend:${{ github.sha }} .
          docker tag ghcr.io/${{ env.REPO_OWNER }}/app_backend:${{ github.sha }} ghcr.io/${{ env.REPO_OWNER }}/app_backend:latest
          docker push ghcr.io/${{ env.REPO_OWNER }}/app_backend:${{ github.sha }}
          docker push ghcr.io/${{ env.REPO_OWNER }}/app_backend:latest

      # Frontend
      - name: Build Frontend
        run: |
          docker build -f Dockerfile.frontend -t ghcr.io/${{ env.REPO_OWNER }}/app_frontend:${{ github.sha }} .
          docker tag ghcr.io/${{ env.REPO_OWNER }}/app_frontend:${{ github.sha }} ghcr.io/${{ env.REPO_OWNER }}/app_frontend:latest
          docker push ghcr.io/${{ env.REPO_OWNER }}/app_frontend:${{ github.sha }}
          docker push ghcr.io/${{ env.REPO_OWNER }}/app_frontend:latest

      # Deploy via SSH
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST_2 }}
          username: ${{ secrets.SERVER_USER_2 }}
          key: ${{ secrets.SERVER_SSH_KEY_2 }}
          port: ${{ secrets.SERVER_PORT_SSH_2 }}
          script: |
            # Clonar o repositório caso não exista, senão dar git pull
            if [ ! -d "~/APP_PRODUTOS/.git" ]; then
              git clone -b main git@github.com:${{ github.repository }} ~/APP_PRODUTOS
            else
              cd ~/APP_PRODUTOS && git pull origin main
            fi

            cd ~/APP_PRODUTOS

            # Exportar variáveis de ambiente para o docker compose
            export MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
            export MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
            export MYSQL_USER=${{ secrets.MYSQL_USER }}
            export MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}

            export APP_ENV=${{ secrets.APP_ENV }}
            export APP_KEY=${{ secrets.APP_KEY }}
            export APP_DEBUG=${{ secrets.APP_DEBUG }}
            export APP_URL=${{ secrets.APP_URL }}

            export DB_CONNECTION=${{ secrets.DB_CONNECTION }}
            export DB_HOST=${{ secrets.DB_HOST }}
            export DB_PORT=${{ secrets.DB_PORT }}
            export DB_DATABASE=${{ secrets.DB_DATABASE }}
            export DB_USERNAME=${{ secrets.DB_USERNAME }}
            export DB_PASSWORD=${{ secrets.DB_PASSWORD }}

            export VITE_API_URL=${{ secrets.VITE_API_URL }}

            docker compose down
            docker compose pull
            docker compose up -d --build
