name: CI/CD Pipeline_APP_PRODUTOS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        run: echo ${{ secrets.CR_PAT }} | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

      - name: Set lowercase repository owner
        id: repo_owner
        run: echo "REPO_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # Build e Push da imagem do backend
      - name: Build Backend Docker image
        run: |
          docker build -f Dockerfile.backend \
            -t ghcr.io/${{ env.REPO_OWNER }}/app_produtos_back:${{ github.sha }} .

      - name: Push Backend Docker image
        run: |
          docker tag ghcr.io/${{ env.REPO_OWNER }}/app_produtos_back:${{ github.sha }} ghcr.io/${{ env.REPO_OWNER }}/app_produtos_back:latest
          docker push ghcr.io/${{ env.REPO_OWNER }}/app_produtos_back:${{ github.sha }}
          docker push ghcr.io/${{ env.REPO_OWNER }}/app_produtos_back:latest

      # Build e Push da imagem do frontend
      - name: Build Frontend Docker image
        run: |
          docker build -f Dockerfile.frontend \
            -t ghcr.io/${{ env.REPO_OWNER }}/app_produtos_front:${{ github.sha }} .

      - name: Push Frontend Docker image
        run: |
          docker tag ghcr.io/${{ env.REPO_OWNER }}/app_produtos_front:${{ github.sha }} ghcr.io/${{ env.REPO_OWNER }}/app_produtos_front:latest
          docker push ghcr.io/${{ env.REPO_OWNER }}/app_produtos_front:${{ github.sha }}
          docker push ghcr.io/${{ env.REPO_OWNER }}/app_produtos_front:latest

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY_2 }}

      - name: Deploy to Server
        run: |
          ssh -t -o StrictHostKeyChecking=no -o ConnectTimeout=60 \
          -p ${{ secrets.SERVER_PORT_SSH_2 }} \
          ${{ secrets.SERVER_USER_SSH_2 }}@${{ secrets.SERVER_HOST_SSH_2 }} << 'EOF'

            # Verificar e liberar a porta 8000 para o backend
            if sudo lsof -i :8000; then
              sudo fuser -k 8000/tcp
              echo "Porta 8000 foi liberada."
            fi

            # Verificar e liberar a porta 3009 para o frontend
            if sudo lsof -i :3009; then
              sudo fuser -k 3009/tcp
              echo "Porta 3009 foi liberada."
            fi

            # Aguardar 5 segundos para garantir que as portas foram liberadas
            sleep 5

            # Parar e remover contêineres existentes
            if sudo docker ps -q --filter "name=app_produtos_back"; then
              sudo docker stop app_produtos_back
              sudo docker rm app_produtos_back
              echo "Contêiner backend anterior parado e removido."
            fi

            if sudo docker ps -q --filter "name=app_produtos_front"; then
              sudo docker stop app_produtos_front
              sudo docker rm app_produtos_front
              echo "Contêiner frontend anterior parado e removido."
            fi

            # Fazer pull das novas imagens
            sudo docker pull ghcr.io/${{ env.REPO_OWNER }}/app_produtos_back:latest
            sudo docker pull ghcr.io/${{ env.REPO_OWNER }}/app_produtos_front:latest

            # Iniciar o backend
            sudo docker run -d \
              --name app_produtos_back \
              --restart=always \
              --network bridge \
              -e TZ=America/Sao_Paulo \
              -e APP_ENV=${{ secrets.APP_ENV }} \
              -e APP_KEY=${{ secrets.APP_KEY }} \
              -e APP_DEBUG=${{ secrets.APP_DEBUG }} \
              -e APP_URL=${{ secrets.APP_URL }} \
              -e DB_CONNECTION=mysql \
              -e DB_HOST=${{ secrets.DB_HOST }} \
              -e DB_PORT=${{ secrets.DB_PORT }} \
              -e DB_DATABASE=${{ secrets.DB_DATABASE }} \
              -e DB_USERNAME=${{ secrets.DB_USERNAME }} \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              -p 8000:8000 \
              ghcr.io/${{ env.REPO_OWNER }}/app_produtos_back:latest

            # Aguardar backend subir
            sleep 15

            # Iniciar o frontend
            sudo docker run -d \
              --name app_produtos_front \
              --restart=always \
              --link app_produtos_back:app_produtos_back \
              -e TZ=America/Sao_Paulo \
              -e VITE_API_URL=http://app_produtos_back:8000/api \
              -p 3009:80 \
              ghcr.io/${{ env.REPO_OWNER }}/app_produtos_front:latest
          EOF
