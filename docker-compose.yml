version: "3.9"

services:
  # =========================
  # MYSQL
  # =========================
  mysql:
    image: mysql:8.0
    container_name: app_produtos_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
    ports:
      - "3310:3306"
    volumes:
      - app_produtos_mysql_data:/var/lib/mysql
    networks:
      - app_network

  # =========================
  # BACKEND (Laravel + PHP-FPM)
  # =========================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: app_produtos_back
    restart: always
    environment:
      TZ: America/Sao_Paulo
      APP_ENV: ${APP_ENV}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG}
      APP_URL: ${APP_URL}
      DB_CONNECTION: ${DB_CONNECTION}
      DB_HOST: mysql          # 👈 conecta no serviço mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - mysql
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    entrypoint: ["/bin/sh", "-c", "php artisan migrate --seed --force && exec /usr/local/bin/backend-entrypoint.sh"]
    networks:
      - app_network

  # =========================
  # FRONTEND (Vite/TS)
  # =========================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: app_produtos_front
    restart: always
    environment:
      TZ: America/Sao_Paulo
      VITE_API_URL: ${APP_URL}
    depends_on:
      - backend
    ports:
      - "3009:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    entrypoint: ["/usr/local/bin/frontend-entrypoint.sh"]
    networks:
      - app_network

# =========================
# VOLUMES & NETWORK
# =========================
volumes:
  app_produtos_mysql_data:

networks:
  app_network:
    driver: bridge
