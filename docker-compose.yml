version: "3.9"

services:
  # =========================
  # MYSQL
  # =========================
  mysql:
    image: mysql:8.0
    container_name: app_produtos_mysql
    restart: always
    env_file:
      - ./backend/.env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
    ports:
      - "3310:3306"
    volumes:
      - app_produtos_mysql_data:/var/lib/mysql
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # =========================
  # BACKEND (Laravel + PHP-FPM)
  # =========================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: app_produtos_back
    restart: always
    env_file:
      - ./backend/.env
    environment:
      TZ: America/Sao_Paulo
      DB_HOST: mysql
      DB_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    entrypoint: ["/bin/sh", "-c", "php artisan migrate --seed --force && exec /usr/local/bin/backend-entrypoint.sh"]
    networks:
      - app_network

  # =========================
  # FRONTEND (Vite/TS)
  # =========================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: app_produtos_front
    restart: always
    env_file:
      - ./backend/.env
    environment:
      TZ: America/Sao_Paulo
      VITE_API_URL: ${APP_URL}
    depends_on:
      - backend
    ports:
      - "3009:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    entrypoint: ["/usr/local/bin/frontend-entrypoint.sh"]
    networks:
      - app_network

# =========================
# VOLUMES & NETWORK
# =========================
volumes:
  app_produtos_mysql_data:

networks:
  app_network:
    driver: bridge
